<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Brave Little Books. A new chapter is on its way. Coming soon.">
    <meta name="theme-color" content="#f6f5f0">
    <title>Brave Little Books — Coming soon</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        background: #f6f5f0;
        color: #293b34;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 2rem;
        text-align: center;
      }

      main {
        width: 100%;
        max-width: 42rem;
      }

      .status {
        margin: 0 0 2rem;
        font-size: 0.75rem;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .status::before {
        content: "";
        display: inline-block;
        width: 0.4rem;
        height: 0.4rem;
        margin-right: 0.75rem;
        border-radius: 50%;
        background: #986149;
        vertical-align: middle;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 7vw, 4.5rem);
        font-weight: 400;
        letter-spacing: -0.055em;
        line-height: 1.1;
        text-wrap: balance;
      }

      .description {
        margin: 1.5rem 0 0;
        color: #5b655f;
        font-size: 1rem;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="status">Coming soon</p>
      <h1>Brave Little Books</h1>
      <p class="description">A new chapter is on its way.</p>
    </main>
  </body>
</html>
